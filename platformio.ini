; Flight-sim MFD for the Waveshare ESP32-S3-Touch-LCD-7
; (ESP32-S3 N16R8: 16 MB flash, 8 MB octal PSRAM; 800x480 ST7262 RGB panel; GT911 touch;
; CH422G I/O expander for backlight and resets).
;
;   pio run                 build
;   pio run -t upload       build + flash (either USB-C port)
;   pio device monitor      serial log

[platformio]
default_envs = waveshare_7

[env:waveshare_7]
; Arduino-ESP32 core 3.x (ESP-IDF 5.x) via pioarduino. Needed for RGB-panel bounce
; buffers: without them the PSRAM-fed panel glitches (picture jumps, colours swap).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Core settings Espressif's RGB-panel example uses for a PSRAM frame buffer with bounce
; buffers (pioarduino rebuilds the Arduino core with these; the first build is slow):
;   64-byte cache lines - faster PSRAM reads in the bounce-buffer refill interrupt
;   XIP from PSRAM      - flash operations don't stall that interrupt
;   ISR in IRAM         - the LCD keeps running while flash is written (WiFi settings)
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y

lib_deps =
    lvgl/lvgl@~8.4.0
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1

build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    ; Serial is UART0, i.e. the "UART" USB-C port (CH343). The bridge's serial link
    ; uses it at 921600 baud; the firmware's log goes out on the same port.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
